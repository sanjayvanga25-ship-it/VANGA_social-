<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanga Social</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f2f2f2;
  padding-bottom:75px;
}

header{
  background:white;
  height:65px;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #ddd;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

.container{
  max-width:500px;
  margin:auto;
}

.post{
  background:white;
  margin:12px 0;
  border-radius:10px;
  overflow:hidden;
}

.user{
  padding:12px;
  font-weight:bold;
  font-size:18px;
}

.post img{
  width:100%;
  display:block;
  max-height:500px;
  object-fit:cover;
}

.actions{
  padding:10px;
}

button{
  border:0;
  background:none;
  font-size:24px;
  margin-right:15px;
}

.likes{
  padding:0 10px 8px;
  font-weight:bold;
}

.caption{
  padding:0 10px 15px;
  font-size:16px;
}

.create{
  background:white;
  margin:12px;
  padding:15px;
  border-radius:10px;
}

.create h3{
  margin-bottom:12px;
}

input[type="file"]{
  width:100%;
  margin-bottom:10px;
}

input[type="text"]{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  margin-bottom:10px;
}

.postBtn{
  background:#1877f2;
  color:white;
  padding:12px 20px;
  border-radius:8px;
  font-size:16px;
  width:100%;
}

nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #ddd;
  z-index:20;
}

nav button{
  font-size:25px;
  margin:0;
}
</style>
</head>

<body>

<header>
  <div class="logo">Vanga Social</div>
  <div>🔍</div>
</header>

<div class="container">

<div class="create">
  <h3>➕ Create New Post</h3>

  <input type="file" id="photo" accept="image/*">

  <input
    type="text"
    id="caption"
    placeholder="Write a caption..."
  >

  <button class="postBtn" onclick="createPost()">
    📸 Post
  </button>
</div>

<div id="feed">

<div class="post">

  <div class="user">👤 Vanga User</div>

  <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80">

  <div class="actions">
    <button onclick="likePost(this)">♡</button>
    <button>💬</button>
    <button>📤</button>
  </div>

  <div class="likes">
    ❤️ <span>0</span> likes
  </div>

  <div class="caption">
    <b>Vanga User</b> Welcome to Vanga Social 🚀
  </div>

</div>

</div>
</div>

<nav>
  <button>🏠</button>
  <button>🔍</button>
  <button>➕</button>
  <button>❤️</button>
  <button>👤</button>
</nav>

<script>

function likePost(button){

  const likes =
    button.parentElement.nextElementSibling;

  const number =
    likes.querySelector("span");

  if(button.innerHTML === "♡"){

    button.innerHTML = "❤️";

    number.innerText =
      Number(number.innerText) + 1;

  }else{

    button.innerHTML = "♡";

    number.innerText =
      Number(number.innerText) - 1;
  }
}


function createPost(){

  const photo =
    document.getElementById("photo");

  const caption =
    document.getElementById("caption");

    alert("Please select a photo");

    return;
  }
